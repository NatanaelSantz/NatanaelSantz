# Atualiza as imagens do perfil que dependem dos números do GitHub (ficam no ramo "output"):
# - estatisticas.svg: contribuições, repositórios, estrelas, seguidores e linguagens
# - github-snake.svg / github-snake-dark.svg: a cobrinha comendo as contribuições do ano
name: Perfil (estatísticas e cobrinha)

on:
  schedule:
    - cron: "17 */12 * * *" # duas vezes por dia
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/cobra.yml"

permissions:
  contents: write

jobs:
  build:
    name: Gerar as imagens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Estatísticas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/estatisticas.py NatanaelSantz dist

      - name: Cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: NatanaelSantz
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#E0A82E&color_dots=#EBEDF0,#C7D2FE,#93A8F8,#5B7CFA,#2340A8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F5C451&color_dots=#161B2E,#1F3170,#2E4AB0,#4F6EF0,#9DB2FF

      - name: Publicar no ramo output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Imagens do perfil atualizadas"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
